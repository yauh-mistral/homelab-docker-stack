      - LETSENCRYPT_HOST=*.meine-domain.de,meine-domain.de
      - LETSENCRYPT_EMAIL=${ACME_DEFAULT_EMAIL}
    networks:
      - shared_proxy

  yauh:
    container_name: yauh
    image: nginx:alpine
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=meine-domain.de,www.meine-domain.de
      - LETSENCRYPT_HOST=meine-domain.de,www.meine-domain.de
      - LETSENCRYPT_EMAIL=${ACME_DEFAULT_EMAIL}
      - VIRTUAL_PORT=80
    volumes:
      - /opt/docker/yauh:/usr/share/nginx/html:ro
    networks:
      - shared_proxy

networks:
  proxy_net:
    driver: bridge
  shared_proxy:
    external: true
