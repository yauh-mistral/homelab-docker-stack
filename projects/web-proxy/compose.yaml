services:
  nginx-proxy:
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    image: nginxproxy/nginx-proxy
    restart: unless-stopped
    environment:
      - TRUST_DOWNSTREAM_PROXY=${PROXY_TRUST_DOWNSTREAM}
      - NGINX_PROXY_CONTAINER_MODIFICATION=${NGINX_MODIFICATION}
    volumes:
      - ${NGINX_BASE_PATH}/staticfiles:/static:ro
      - ${NGINX_BASE_PATH}/mediafiles:/media:ro
      - ${NGINX_BASE_PATH}/conf:/etc/nginx/conf.d
      - ${NGINX_BASE_PATH}/vhost:/etc/nginx/vhost.d
      - ${NGINX_BASE_PATH}/html:/usr/share/nginx/html
      - ${NGINX_BASE_PATH}/certs:/etc/nginx/certs:ro
      - ${NGINX_BASE_PATH}/htpasswd:/etc/nginx/htpasswd
      - ${NGINX_BASE_PATH}/logs:/var/log/nginx
      - /var/run/docker.sock:/tmp/docker.sock:ro
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - proxy_net
      - shared_proxy

  acme-companion:
    container_name: ${COMPOSE_PROJECT_NAME}-acme
    image: nginxproxy/acme-companion
    restart: unless-stopped
    depends_on:
      nginx-proxy:
        condition: service_healthy
    environment:
      DEFAULT_EMAIL: ${ACME_DEFAULT_EMAIL}
      NGINX_PROXY_CONTAINER: ${COMPOSE_PROJECT_NAME}-nginx
      DEBUG: ${ACME_DEBUG}
      DEDYN_TOKEN: ${DESEC_TOKEN}
      ACME_CHALLENGE: ${ACME_CHALLENGE}
      ACMESH_DNS_API_CONFIG: |-
        DNS_API: dns_desec
        DESEC_TOKEN: ${DESEC_TOKEN}
    volumes:
      - ${ACME_BASE_PATH}/etc/acme.sh:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${NGINX_BASE_PATH}/conf:/etc/nginx/conf.d
      - ${NGINX_BASE_PATH}/vhost:/etc/nginx/vhost.d
      - ${NGINX_BASE_PATH}/html:/usr/share/nginx/html
      - ${NGINX_BASE_PATH}/certs:/etc/nginx/certs:rw
    healthcheck:
      test: ["CMD-SHELL", "test -d /etc/acme.sh && pgrep -f docker-gen || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - proxy_net
      - shared_proxy

  # Wildcard-Zertifikat pro Domain-Familie. Der VIRTUAL_HOST ist ein reiner
  # Dummy (Routing-Platzhalter, damit der Proxy einen vhost anlegt) und bewusst
  # hardcoded: er gehoert zur Compose-Struktur, nicht zur Konfiguration.
  cert-1:
    container_name: cert-1
    image: alpine
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped
    depends_on:
      acme-companion:
        condition: service_started
    environment:
      - VIRTUAL_HOST=cert-dummy-1.local
      - LETSENCRYPT_HOST=${WILDCARD_DOMAINS_1}
      - LETSENCRYPT_EMAIL=${ACME_DEFAULT_EMAIL}
    networks:
      - shared_proxy

  cert-2:
    container_name: cert-2
    image: alpine
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped
    depends_on:
      acme-companion:
        condition: service_started
    environment:
      - VIRTUAL_HOST=cert-dummy-2.local
      - LETSENCRYPT_HOST=${WILDCARD_DOMAINS_2}
      - LETSENCRYPT_EMAIL=${ACME_DEFAULT_EMAIL}
    networks:
      - shared_proxy

  cert-3:
    container_name: cert-3
    image: alpine
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped
    depends_on:
      acme-companion:
        condition: service_started
    environment:
      - VIRTUAL_HOST=cert-dummy-3.local
      - LETSENCRYPT_HOST=${WILDCARD_DOMAINS_3}
      - LETSENCRYPT_EMAIL=${ACME_DEFAULT_EMAIL}
    networks:
      - shared_proxy

  cert-4:
    container_name: cert-4
    image: alpine
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped
    depends_on:
      acme-companion:
        condition: service_started
    environment:
      - VIRTUAL_HOST=cert-dummy-4.local
      - LETSENCRYPT_HOST=${WILDCARD_DOMAINS_4}
      - LETSENCRYPT_EMAIL=${ACME_DEFAULT_EMAIL}
    networks:
      - shared_proxy

  cert-5:
    container_name: cert-5
    image: alpine
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped
    depends_on:
      acme-companion:
        condition: service_started
    environment:
      - VIRTUAL_HOST=cert-dummy-5.local
      - LETSENCRYPT_HOST=${WILDCARD_DOMAINS_5}
      - LETSENCRYPT_EMAIL=${ACME_DEFAULT_EMAIL}
    networks:
      - shared_proxy

  cert-6:
    container_name: cert-6
    image: alpine
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped
    depends_on:
      acme-companion:
        condition: service_started
    environment:
      - VIRTUAL_HOST=cert-dummy-6.local
      - LETSENCRYPT_HOST=${WILDCARD_DOMAINS_6}
      - LETSENCRYPT_EMAIL=${ACME_DEFAULT_EMAIL}
    networks:
      - shared_proxy

  main-site:
    container_name: main-site
    image: nginx:alpine
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${MAIN_DOMAIN},${WWW_DOMAIN}
      - LETSENCRYPT_HOST=${MAIN_DOMAIN},${WWW_DOMAIN}
      - LETSENCRYPT_EMAIL=${ACME_DEFAULT_EMAIL}
      - VIRTUAL_PORT=${MAIN_SITE_PORT}
    volumes:
      - /opt/docker/yauh:/usr/share/nginx/html:ro
    networks:
      - shared_proxy

networks:
  proxy_net:
    driver: bridge
  shared_proxy:
    external: true
