services:
  litellm_db:
    container_name: litellm_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /opt/docker/litellm/postgres_data:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - ai_net
  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    restart: unless-stopped
    depends_on:
      litellm_db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@litellm_db:5432/${POSTGRES_DB}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - UI_USERNAME=${UI_USER}
      - UI_PASSWORD=${UI_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VIRTUAL_HOST=${LITELLM_DOMAIN}
      - VIRTUAL_PORT=${LITELLM_PORT}
      - LITELLM_DISABLE_NO_REDIS_WARNING=${LITELLM_DISABLE_NO_REDIS_WARNING}
    volumes:
      - /opt/docker/litellm/config.yaml:/app/config.yaml
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - ai_net
      - shared_proxy

  crawl4ai:
    container_name: crawl4ai
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${CRAWL4AI_DOMAIN}
      - VIRTUAL_PORT=${CRAWL4AI_PORT}
      - TZ=${TZ}
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - ai_net
      - shared_proxy
    shm_size: '2gb'


  valkey:
    container_name: valkey
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - /opt/docker/valkey/:/data
    networks:
      - ai_net
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    depends_on:
      - valkey
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - VIRTUAL_HOST=${SEARXNG_HOSTNAME}
      - VIRTUAL_PORT=${SEARXNG_PORT}
      - TZ=${TZ}
    volumes:
      - /opt/docker/searxng/etc/searchnxg:/etc/searxng:rw
      - /opt/docker/searxng/data:/var/cache/searxng:rw
    networks:
      - ai_net
      - shared_proxy
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  ai_net:
    driver: bridge
  shared_proxy:
    external: true
