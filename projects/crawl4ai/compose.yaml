services:
  crawl4ai:
    container_name: crawl4ai
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=crawl4ai.meine-domain.de
      - VIRTUAL_PORT=11235
      - TZ=Europe/Berlin
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - searxng
      - shared_proxy
    shm_size: '2gb'
networks:
  searxng:
  shared_proxy:
    external: true
