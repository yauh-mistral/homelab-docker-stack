services:
  mealie:
    container_name: mealie
    image: hkotel/mealie:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - BASE_URL=https://recipes.meine-domain.de # Important for reverse proxy
      - DB_ENGINE=postgres
      - POSTGRES_SERVER=192.168.0.15
      - POSTGRES_PORT=5400
      - POSTGRES_USER=mealieuser
      - POSTGRES_PASSWORD=j9aPeId9ojTh!dfl00dEqX # Replace with a strong password
      - POSTGRES_DB=mealie
      - SECRET_KEY=your_mealie_secret_key # Replace with a strong secret key
      - VIRTUAL_HOST=recipes.meine-domain.de
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_FROM_NAME=Mealie
      - SMTP_AUTH_STRATEGY=TLS
      - SMTP_FROM_EMAIL=${SMTP_FROM}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - /opt/docker/mealie/data:/app/data

    ports:
      - 9925:9000 # Expose Mealie's port (internal)
    networks:
      - shared_db
      - shared_proxy
networks:
  shared_db:
    external: true
  shared_proxy:
    external: true
