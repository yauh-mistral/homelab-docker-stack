services:
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl
    container_name: firecrawl
    restart: unless-stopped
    #command: ["node", "apps/api/dist/index.js"] # Forces the image to run as the API engine
    expose:
      - "3002"
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - REDIS_URL=redis://firecrawl-redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000
      - USE_DB_AUTHENTICATION=false
      # Nginx proxy settings
      - VIRTUAL_HOST=firecrawl.islasorna.de
      - VIRTUAL_PORT=3002
    networks:
      - firecrawl
      - shared_proxy
    depends_on:
      - redis
      - playwright
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:alpine
    container_name: firecrawl-redis
    restart: unless-stopped
    networks:
      - firecrawl
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  playwright:
    image: browserless/chrome:latest
    container_name: firecrawl-playwright
    restart: unless-stopped
    networks:
      - firecrawl
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=600000
      - PREBOOT_CHROME=true
      - KEEP_ALIVE=true
      - WORKSPACE_DELETE_EXPIRED=true
      - WORKSPACE_EXPIRE_DAYS=1
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/pressure"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  firecrawl:
    driver: bridge
  shared_proxy:
    external: true

volumes:
  redis-data:
    driver: local