version: '3.7'
services:
  # --- 1. PostgreSQL Database Service ---
  n8n-db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ${N8N_DB_DATA_PATH}:/var/lib/postgresql/data
    networks:
      - default_n8n # Internal-only network for DB security
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 2. n8n Main Service ---
  n8n:
    image: n8nio/n8n:latest
    container_name: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped
    # No ports needed on the host, as Nginx-Proxy will handle port 80/443 traffic.

    # ⚠️ Wait for the database to be healthy before starting n8n
    depends_on:
      n8n-db:
        condition: service_healthy

    environment:
      # --- Base Settings ---
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

      # --- Database Connection ---
      # VITAL: Connects to the internal service name 'n8n-db'
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_NAME}
      - DB_POSTGRESDB_USER=${DB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}

      # --- Security & Host Alignment ---
      # VITAL: Tells n8n the external URL it runs on for webhook generation
      - N8N_PROTOCOL=https
      - N8N_HOST=${N8N_HOST}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=true # Highly Recommended for initial security

      # --- Proxy Configuration for Nginx-Proxy (jwilder/nginx-proxy) ---
      - VIRTUAL_HOST=${N8N_HOST}
      - VIRTUAL_PORT=${N8N_PORT} # Nginx-Proxy will connect to n8n container on 5678
      - CERT_NAME=${CERT_NAME}
      
    volumes:
      # Mount the data volume for settings and credentials
      - ${N8N_DATA_PATH}:/home/node/.n8n
      - /etc/localtime:/etc/localtime:ro

    networks:
      - default_n8n   # Internal communication
      - shared_proxy  # External access via Nginx-Proxy

networks:
  # Internal network for DB and n8n server communication
  default_n8n:
    driver: bridge
  
  # External network for web exposure via Nginx-Proxy
  shared_proxy:
    external: true