version: "3.8"

services:
  ghost:
    image: ghost:6-alpine
    container_name: ghost
    restart: unless-stopped
    ports:
      - "${GHOST_WEB_PORT}:2368"
    environment:
      - VIRTUAL_HOST=${GHOST_DOMAIN}
      - url=${GHOST_URL}
      - database__client=mysql
      - database__connection__host=ghost-mysql
      - database__connection__port=3306
      - database__connection__user=${DB_USER}
      - database__connection__password=${DB_PASSWORD}
      - database__connection__database=${GHOST_DB_NAME}
      # ActivityPub configuration
      - activitypub__enabled=true
      #- activitypub__url=https://www.herrhochhaus.de/.ghost/activitypub
      - activitypub__url=http://activitypub:8080/.ghost/activitypub
      - activitypub__webhookSecret=${ACTIVITYPUB_WEBHOOK_SECRET}
      - ACTIVITYPUB_WEBHOOK_SECRET=${ACTIVITYPUB_WEBHOOK_SECRET}
      - activitypub__basePath=/.ghost/activitypub
      - ACTIVITYPUB_TARGET=http://activitypub:8080  # Enables internal microservice routing
      # Mail configuration
      - mail__transport=SMTP
      - mail__options__service=${SMTP_SERVICE}
      - mail__options__host=${SMTP_HOST}
      - mail__options__port=${SMTP_PORT}
      - mail__options__auth__user=${SMTP_USERNAME}
      - mail__options__auth__pass=${SMTP_PASSWORD}
      - mail__from=${SMTP_FROM}
    volumes:
      - ${GHOST_CONTENT_PATH}:/var/lib/ghost/content
    networks:
      - shared_proxy
      - ghost_network
    depends_on:
      - mysql
      - activitypub

  activitypub:
    image: ghcr.io/tryghost/activitypub:1.2
    container_name: ghost-activitypub
    restart: always
    expose:
      - "8080"
    volumes:
      - ${GHOST_CONTENT_PATH}:/opt/activitypub/content
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_USER=${DB_USER:-ghost}
      - MYSQL_PASSWORD=${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      - MYSQL_DATABASE=${ACTIVITYPUB_DB_NAME}
      - LOCAL_STORAGE_PATH=/opt/activitypub/content/images/activitypub
      - LOCAL_STORAGE_HOSTING_URL=${GHOST_URL}/content/images/activitypub
      - PUBLIC_URL=https://www.herrhochhaus.de
      - WEBHOOK_SECRET=${ACTIVITYPUB_WEBHOOK_SECRET}
      - BASE_PATH=/.ghost/activitypub
      - GHOST_URL=http://ghost:2368
      - QUEUE_DRIVER=memory
    depends_on:
      mysql:
        condition: service_healthy
      activitypub-migrate:
        condition: service_completed_successfully
    networks:
      - shared_proxy
      - ghost_network

  mysql:
    image: mysql:9
    container_name: ghost-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${GHOST_DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ}
    ports:
      - "${GHOST_MYSQL_PORT}:3306"
    volumes:
      - ${MYSQL_DATA_PATH}:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: mysqladmin ping -p$$MYSQL_ROOT_PASSWORD -h 127.0.0.1
      interval: 1s
      start_period: 30s
      start_interval: 10s
      retries: 120
    networks:
      - ghost_network

  activitypub-migrate:
    image: ghcr.io/tryghost/activitypub-migrations:1.2
    container_name: ghost-activitypub-migrate
    environment:
      - MYSQL_DB=mysql://${DB_USER:-ghost}:${DB_PASSWORD:?DB_PASSWORD environment variable is required}@tcp(mysql:3306)/${ACTIVITYPUB_DB_NAME}
    networks:
      - ghost_network
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

networks:
  ghost_network:
    driver: bridge
  shared_proxy:
    external: true