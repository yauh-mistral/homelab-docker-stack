services:
  ghost:
    container_name: ghost
    image: ghost:6-alpine
    restart: unless-stopped
    depends_on:
      - mysql
      - activitypub

    environment:
      - VIRTUAL_HOST=${GHOST_DOMAIN}
      - url=${GHOST_URL}
      - database__client=${GHOST_DB_CLIENT}
      - database__connection__host=${GHOST_DB_HOST}
      - database__connection__port=${GHOST_DB_PORT}
      - database__connection__user=${MYSQL_USER}
      - database__connection__password=${MYSQL_PASSWORD}
      - database__connection__database=${GHOST_DB_NAME}
      # ActivityPub configuration
      - activitypub__enabled=${ACTIVITYPUB_ENABLED}
      #- activitypub__url=https://www.meine-domain.de/.ghost/activitypub
      - activitypub__url=${ACTIVITYPUB_INTERNAL_URL}
      - activitypub__webhookSecret=${ACTIVITYPUB_WEBHOOK_SECRET}
      - ACTIVITYPUB_WEBHOOK_SECRET=${ACTIVITYPUB_WEBHOOK_SECRET}
      - activitypub__basePath=${ACTIVITYPUB_BASE_PATH}
      - ACTIVITYPUB_TARGET=${ACTIVITYPUB_INTERNAL_URL}  # Enables internal microservice routing
      # Mail configuration
      - mail__transport=${GHOST_MAIL_TRANSPORT}
      - mail__options__service=${SMTP_SERVICE}
      - mail__options__host=${SMTP_HOST}
      - mail__options__port=${SMTP_PORT}
      - mail__options__auth__user=${SMTP_USER}
      - mail__options__auth__pass=${SMTP_PASSWORD}
      - mail__from=${SMTP_FROM}
    volumes:
      - ${GHOST_CONTENT_PATH}:/var/lib/ghost/content
    ports:
      - "${GHOST_WEB_PORT}:2368"
    networks:
      - shared_proxy
      - ghost_network
  activitypub:
    container_name: ghost-activitypub
    image: ghcr.io/tryghost/activitypub:1.2
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      activitypub-migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=${ACTIVITYPUB_NODE_ENV}
      - MYSQL_HOST=${ACTIVITYPUB_MYSQL_HOST}
      - MYSQL_USER=${MYSQL_USER:-ghost}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD environment variable is required}
      - MYSQL_DATABASE=${ACTIVITYPUB_DB_NAME}
      - LOCAL_STORAGE_PATH=${ACTIVITYPUB_STORAGE_PATH}
      - LOCAL_STORAGE_HOSTING_URL=${GHOST_URL}/content/images/activitypub
      - PUBLIC_URL=${GHOST_URL}
      - WEBHOOK_SECRET=${ACTIVITYPUB_WEBHOOK_SECRET}
      - BASE_PATH=${ACTIVITYPUB_BASE_PATH}
      - GHOST_URL=${ACTIVITYPUB_GHOST_URL}
      - QUEUE_DRIVER=${ACTIVITYPUB_QUEUE_DRIVER}
    volumes:
      - ${GHOST_CONTENT_PATH}:/opt/activitypub/content
    expose:
      - "8080"
    networks:
      - shared_proxy
      - ghost_network

  mysql:
    container_name: ghost-mysql
    image: mysql:9
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${GHOST_DB_NAME}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ${MYSQL_DATA_PATH}:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${GHOST_MYSQL_PORT}:3306"
    healthcheck:
      test: mysqladmin ping -p$$MYSQL_ROOT_PASSWORD -h 127.0.0.1
      interval: 1s
      start_period: 30s
      start_interval: 10s
      retries: 120
    networks:
      - ghost_network

  activitypub-migrate:
    container_name: ghost-activitypub-migrate
    image: ghcr.io/tryghost/activitypub-migrations:1.2
    restart: "no"

    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_DB=mysql://${MYSQL_USER:-ghost}:${MYSQL_PASSWORD:?MYSQL_PASSWORD environment variable is required}@tcp(mysql:3306)/${ACTIVITYPUB_DB_NAME}
    networks:
      - ghost_network
networks:
  ghost_network:
    driver: bridge
  shared_proxy:
    external: true
