# policy.conf — central backup policy (defaults & global rules).
# Loaded by backup.sh/restore.sh/test-restore.sh before policies.d/.
# All values can be overridden via /etc/backup.conf.

# Allowlist: ONLY paths under these prefixes are backup sources.
# Everything else (NAS mounts /mnt, download staging /opt/downloads,
# OS runtime /run,/etc,/proc,..., host root /) is never backed up.
ALLOW_PATH_PREFIXES=(
  "/opt/docker"
)

# Default excludes for ALL file backups: skip rebuildable data
# (restore philosophy: compute at restore time is fine).
# Discovered mounts with these directory names are logger/cache mounts,
# not data — skipped as sources (exclude patterns do not apply at the
# transfer root).
SKIP_MOUNT_BASENAMES=(
  "logs"
  "log"
)

DEFAULT_FILE_EXCLUDES=(
  "logs/"
  "log/"
  "*.log"
  "tmp/"
  "cache/"
  "Cache/"
  "cache_*/"
)

# Thumbnail/cache backup: no by default (rebuildable via library scan).
# If yes: control via policies.d/<service>.env KEEP_FILES/excludes.
THUMBNAILS=false

# Policy overlays per project/container
POLICY_DIR="${POLICY_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/policies.d}"
