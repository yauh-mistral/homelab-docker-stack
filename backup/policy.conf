# policy.conf — Zentrale Backup-Policy (Defaults & globale Regeln).
# Geladen von backup.sh/restore.sh/test-restore.sh vor policies.d/.
# Alle Werte via /etc/backup.conf ueberschreibbar.

# Pfade unter diesen Praefixen werden NIEMALS gesichert (NAS hat eigenes
# Backup, tmp ist fluechtig).
IGNORE_PATH_PREFIXES=(
  "/mnt"
  "/tmp"
  "/var/tmp"
)

# Default-Excludes fuer ALLE Datei-Backups: Rebuildbares weglassen
# (Restore-Philosophie: Compute beim Restore ist ok).
DEFAULT_FILE_EXCLUDES=(
  "logs/"
  "log/"
  "*.log"
  "tmp/"
  "cache/"
  "Cache/"
  "cache_*/"
)

# Thumbnail-/Cache-Sicherung: Default nein (rebuildbar via Library-Scan).
# Bei ja: ueber policies.d/<service>.env KEEP_FILES/Excludes steuern.
THUMBNAILS=false

# Policy-Overlays pro Projekt/Container
POLICY_DIR="${POLICY_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/policies.d}"
